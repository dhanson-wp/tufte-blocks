name: Deploy theme to WordPress.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: SFTP deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp

      - name: Deploy via SFTP (lftp)
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASS }}
        run: |
          lftp -u "${{ secrets.SFTP_USER }}" --env-password sftp://${{ secrets.SFTP_HOST }} -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 30;
            mirror -R --verbose \
              --exclude-glob .git \
              --exclude-glob .git/* \
              --exclude-glob .github \
              --exclude-glob .github/* \
              --exclude-glob .DS_Store \
              --exclude-glob node_modules \
              --exclude-glob node_modules/* \
              --exclude-glob .idea \
              --exclude-glob .idea/* \
              --exclude-glob .vscode \
              --exclude-glob .vscode/* \
              --exclude-glob README.md \
              --exclude-glob '*.swp' \
              . ${{ secrets.SFTP_REMOTE_PATH }};
            bye
          "
